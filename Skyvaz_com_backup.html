<style>

body{margin:0;min-height:100%;background:radial-gradient(820px 440px at 50% -90px,var(--glow),transparent 70%) no-repeat,var(--bg);color:var(--ink);font:16px/1.45 'Bricolage Grotesque',system-ui,-apple-system,sans-serif}

h1{font-size:32px;line-height:1.1;margin:8px 0 6px;font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 4px;font-weight:800}
p{margin:0 0 14px;color:var(--mut)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}

.em{font-size:26px}
.prog{height:6px;background:var(--line);border-radius:3px;margin-bottom:22px;overflow:hidden}

.ghost{background:none;border:0;color:var(--mut);font:inherit;text-decoration:underline;cursor:pointer;padding:8px 0}

.tab{flex:1;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 6px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 10px 24px -16px rgba(15,90,45,.45)}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:11px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}

.low{color:var(--bad);font-weight:800}.pos{color:var(--ok)}.neg{color:var(--bad)}
.mods{display:flex;flex-wrap:wrap;gap:6px}.mods span{border:1px dashed var(--mut);border-radius:20px;padding:4px 10px;font-size:13px;color:var(--mut)}
.dz{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--acc);border-radius:16px;padding:18px;cursor:pointer;background:var(--bg);color:var(--ink);font-weight:400;margin:0}.dz.over{background:var(--glow)}.dz small{color:var(--mut)}

var BK="skyvaz:bk";
function bkDias(){var t=0;try{t=+localStorage.getItem(BK)||0}catch(e){}return t?Math.floor((Date.now()-t)/864e5):null}
function bkMark(){try{localStorage.setItem(BK,String(Date.now()))}catch(e){}}
function bkTxt(){var d=bkDias();return d===null?"Você ainda não fez backup.":(d===0?"Último backup: hoje.":"Último backup: há "+d+" dia(s).")}
function bkBanner(){var d=bkDias();if(!S.prods.length||(d!==null&&d<7))return"";return '<div class="card" style="border-color:var(--acc);border-width:2px"><b>Faça um backup</b><p style="margin:4px 0">'+(d===null?"Você ainda não salvou nenhum backup.":"Seu último backup foi há "+d+" dias.")+' Vá em Mais e toque em Salvar backup.</p></div>'}
function backupCard(){return '<div class="card"><h2>Backup dos dados</h2><p>Seus dados ficam só neste aparelho. Salve uma cópia para não perder vendas, estoque e histórico.</p><p id="bki" style="margin:8px 0"><b>'+bkTxt()+'</b></p><button class="btn" id="bksave">Salvar backup</button>'+(navigator.canShare?'<button class="ghost" id="bkshare">Enviar backup (WhatsApp, Drive...)</button>':'')+'<h2 style="margin-top:16px">Restaurar backup</h2>'+dropZone()+'<p id="bkm" style="margin:8px 0" role="status"></p></div>'}
function bkFile(){save();var d=null;try{d=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}
 return new File([JSON.stringify({app:"skyvaz",v:1,em:new Date().toISOString(),nome:NOME,dados:d})],"skyvaz-backup-"+hoje()+".json",{type:"application/json"})}
function bkBind(){
 dzBind();
 function bm(t){var m=document.getElementById("bkm");if(m)m.textContent=t}
 function done(){bkMark();var i=document.getElementById("bki");if(i)i.innerHTML="<b>"+bkTxt()+"</b>"}
 var sv=document.getElementById("bksave");if(!sv)return;
 sv.onclick=function(){try{var f=bkFile(),u=URL.createObjectURL(f),a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);done();bm("Backup salvo: "+f.name+". Guarde em um lugar seguro.")}catch(e){bm("Não foi possível salvar o backup neste navegador.")}};
 var sh=document.getElementById("bkshare");
 if(sh)sh.onclick=function(){try{var f=bkFile();if(!navigator.canShare({files:[f]})){bm("Este aparelho não permite enviar arquivos. Use Salvar backup.");return}
  navigator.share({files:[f],title:"Backup Skyvaz"}).then(function(){done();bm("Backup enviado.")}).catch(function(){})}catch(e){bm("Não foi possível enviar. Use Salvar backup.")}};

}

function dropZone(){return '<div class="dz" id="dz" role="button" tabindex="0"><span style="font-size:28px">📂</span><b>Toque aqui ou arraste o arquivo de backup</b><small>Arquivo .json salvo pelo Skyvaz. Substitui os dados atuais.</small></div><input id="bkfile" type="file" accept=".json,application/json" style="display:none">'}
function dzBind(){var z=document.getElementById("dz"),f=document.getElementById("bkfile");if(!z||!f)return;
 z.onclick=function(){f.click()};
 z.onkeydown=function(e){if(e.key=="Enter"||e.key==" "){e.preventDefault();f.click()}};
 ["dragenter","dragover"].forEach(function(n){z.addEventListener(n,function(e){e.preventDefault();z.classList.add("over")})});
 z.addEventListener("dragleave",function(){z.classList.remove("over")});
 z.addEventListener("drop",function(e){e.preventDefault();z.classList.remove("over");var x=e.dataTransfer&&e.dataTransfer.files[0];if(x)bkRestore(x)});
 f.onchange=function(){var x=f.files[0];f.value="";if(x)bkRestore(x)}}
function bkRestore(file){
 var R=document.getElementById("rst"),T=document.getElementById("rt"),B=document.getElementById("rb"),X=document.getElementById("rx");
 function step(t,p){T.textContent=t;B.style.width=p+"%"}
 function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
 R.classList.add("on");X.style.display="none";B.style.width="0%";step("Lendo o arquivo…",10);
 new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=function(){no("Não foi possível ler o arquivo.")};r.readAsText(file)})
 .then(function(txt){step("Analisando o backup…",35);return wait(800).then(function(){
   var o;try{o=JSON.parse(txt)}catch(e){throw "Esse arquivo não é um backup válido."}
   var d=o&&o.dados;if(!o||o.app!=="skyvaz"||!d)throw "Esse arquivo não é um backup do Skyvaz.";
   if(!d.ans||!N[d.ans.tipo]||!Array.isArray(d.prods)||!Array.isArray(d.vendas)||!Array.isArray(d.gastos))throw "O backup está incompleto ou danificado.";
   if(d.prods.some(function(p){return !p||typeof p.n!=="string"||isNaN(+p.p)||isNaN(+p.q)}))throw "Há produtos danificados no backup.";
   return o})})
 .then(function(o){var d=o.dados,dt=o.em?o.em.slice(0,10).split("-").reverse().join("/"):"data desconhecida";
   step("Backup de "+dt+" encontrado: "+d.prods.length+" produtos.",60);
   return wait(1200).then(function(){step("Restaurando seus dados…",85);return wait(1000)}).then(function(){
    localStorage.setItem(K,JSON.stringify(d));
    if(o.nome){localStorage.setItem(NK,o.nome);localStorage.removeItem(NK+"s")}else{localStorage.removeItem(NK);localStorage.setItem(NK+"s","1")}
    bkMark();step("Pronto!",100);return wait(700)}).then(function(){location.reload()})})
 .catch(function(e){step(typeof e==="string"?e:"Não foi possível restaurar o backup neste navegador.",0);X.style.display="";X.onclick=function(){R.classList.remove("on");X.style.display="none"}})}
